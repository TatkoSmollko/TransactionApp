version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-transactions-service
    environment:
      MYSQL_DATABASE: transactionsServiceDb
      MYSQL_USER: test
      MYSQL_PASSWORD: test
      MYSQL_ROOT_PASSWORD: test
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
