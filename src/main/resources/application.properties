spring.application.name=transactionService

spring.profiles.active=local


# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/transactionsServiceDb
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Flyway settings (nezÃÂ¡vislÃÂ©)
spring.flyway.enabled=true
spring.flyway.url=jdbc:mysql://localhost:3306/transactionsServiceDb
spring.flyway.user=test
spring.flyway.password=test


spring.kafka.bootstrap-servers=localhost:9092

# PRODUCER config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.admin.auto-create=true
spring.kafka.admin.fail-fast=false


# CONSUMER config
spring.kafka.consumer.group-id=fee-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


